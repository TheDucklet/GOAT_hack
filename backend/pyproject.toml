[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goat-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.153.0", "uvicorn==0.54.0", "sqlalchemy==2.0.55",
  "psycopg[binary]==3.3.6", "alembic==1.20.0", "pydantic-settings==2.16.1",
  "email-validator==2.3.0", "python-multipart==0.0.32",
  "argon2-cffi==25.1.0",
  "httpx==0.28.1", "feedparser==6.0.14", "beautifulsoup4==4.15.0",
  "pypdf==6.21.1", "pypdfium2==5.14.0", "pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
