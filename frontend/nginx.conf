resolver 127.0.0.11 valid=10s ipv6=off;

upstream goat_api {
    zone goat_api 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 51m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        proxy_pass http://goat_api/health;
    }

    location /api/ {
        proxy_pass http://goat_api/;
    }

    # FastAPI's Swagger page requests this absolute path.
    location = /openapi.json {
        proxy_pass http://goat_api/openapi.json;
    }

    # Evidence URLs returned by the backend keep their protected source path.
    location /sources/ {
        proxy_pass http://goat_api/sources/;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
