# Isolated access-management acceptance, no news or AI work.
services:
  postgres:
    environment:
      POSTGRES_DB: goat_r07
      POSTGRES_PASSWORD: r07-local-only
  api:
    environment: &r07-environment
      DATABASE_URL: postgresql+psycopg://goat:r07-local-only@postgres:5432/goat_r07
      AI_MODULE: ""
      AI_LLM_API_KEY: ""
      NEWS_COLLECTION_ENABLED: "false"
      CORS_ORIGINS: '["http://127.0.0.1:8088","http://localhost:8088"]'
    volumes:
      - ./frontend/tests:/srv/r07:ro
  worker:
    environment: *r07-environment
  web:
    ports: !override
      - "127.0.0.1:8088:80"
